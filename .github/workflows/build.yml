name: Aether CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, aarch64-linux-android
        
    - name: Install ARM64 Cross-Compilation Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        
    - name: Configure Cargo for Linux ARM cross-compilation
      run: |
        mkdir -p .cargo
        echo '[target.aarch64-unknown-linux-gnu]' > .cargo/config.toml
        echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml

    - name: Build Standard Linux binaries
      run: |
        cargo build --release --target x86_64-unknown-linux-gnu
        cargo build --release --target aarch64-unknown-linux-gnu

    # --- ZDE JE TVÉ AUTOMATICKÉ TESTOVÁNÍ! ---
    - name: Run Automated Aether Tests (E2E)
      run: |
        echo "🚀 Spouštím automatické testy pro všechny .ae soubory ve složce tests/..."
        for script in tests/*.ae; do
          echo "----------------------------------------"
          echo "📜 Testuji: $script"
          # Použijeme PC verzi kompilátoru, protože běžíme na GitHub serveru
          ./target/x86_64-unknown-linux-gnu/release/aether "$script"
        done
        echo "----------------------------------------"
        echo "✅ Všechny testy úspěšně proběhly!"

    - name: Install cargo-deb
      run: cargo install cargo-deb

    - name: Build Standard .deb packages
      run: |
        cargo deb --target x86_64-unknown-linux-gnu --no-build
        cargo deb --target aarch64-unknown-linux-gnu --no-build

    - name: Install cargo-ndk (Android builder)
      run: cargo install cargo-ndk

    - name: Build Termux Native (Android aarch64)
      run: cargo ndk -t arm64-v8a build --release

    - name: Build 100% Native Termux .deb
      run: |
        mkdir -p termux_pkg/data/data/com.termux/files/usr/bin
        mkdir -p termux_pkg/DEBIAN
        cp target/aarch64-linux-android/release/aether termux_pkg/data/data/com.termux/files/usr/bin/
        chmod 755 termux_pkg/data/data/com.termux/files/usr/bin/aether
        cat << 'CTRL' > termux_pkg/DEBIAN/control
        Package: aether
        Version: 0.1.0-termux
        Architecture: aarch64
        Maintainer: Aether Developer
        Description: Aether Compiler (100% Native Android/Termux Edition)
        CTRL
        dpkg-deb --build termux_pkg target/aether-termux_0.1.0-1_aarch64.deb

    - name: Upload .deb Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aether-debian-packages
        path: |
          target/debian/*.deb
          target/aether-termux_0.1.0-1_aarch64.deb
